# Reproducible Build Verification for R-SRP
# Double-build verification - compares TOE hashes between independent runners.

name: Reproducible Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN_VERSION: "1.90.0"
  TOE_BINARY: rsrp-demo

jobs:
  build-a:
    name: Build A (Ubuntu)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
      - name: Install OQS deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            clang-14 \
            llvm-14-dev \
            libclang-14-dev \
            pkg-config \
            jq
          echo "LIBCLANG_PATH=/usr/lib/llvm-14/lib" >> "$GITHUB_ENV"
      - name: Prefetch dependencies
        run: cargo fetch --locked
      - name: Set SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Build TOE
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path rsrp-demo/Cargo.toml --features production
      - name: Record build A metadata
        run: |
          set -euo pipefail
          mkdir -p certification/evidence/reproducibility
          jq -n \
            --arg toe_binary "${TOE_BINARY}" \
            --arg artifact_sha256 "$(sha256sum target/release/${TOE_BINARY} | awk '{print $1}')" \
            --arg cargo_lock_sha256 "$(sha256sum Cargo.lock | awk '{print $1}')" \
            --arg rustc_version "$(rustc --version --verbose | tr '\n' ';' | sed 's/;$/\n/' )" \
            '{toe_binary: $toe_binary, artifact_sha256: $artifact_sha256, cargo_lock_sha256: $cargo_lock_sha256, rustc_version: $rustc_version}' \
            > certification/evidence/reproducibility/build-a.json
      - name: Upload build A metadata
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-a-${{ github.sha }}
          path: certification/evidence/reproducibility/build-a.json
          retention-days: 7

  build-b:
    name: Build B (Ubuntu)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
      - name: Install OQS deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            clang-14 \
            llvm-14-dev \
            libclang-14-dev \
            pkg-config \
            jq
          echo "LIBCLANG_PATH=/usr/lib/llvm-14/lib" >> "$GITHUB_ENV"
      - name: Prefetch dependencies
        run: cargo fetch --locked
      - name: Set SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Build TOE
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path rsrp-demo/Cargo.toml --features production
      - name: Record build B metadata
        run: |
          set -euo pipefail
          mkdir -p certification/evidence/reproducibility
          jq -n \
            --arg toe_binary "${TOE_BINARY}" \
            --arg artifact_sha256 "$(sha256sum target/release/${TOE_BINARY} | awk '{print $1}')" \
            --arg cargo_lock_sha256 "$(sha256sum Cargo.lock | awk '{print $1}')" \
            --arg rustc_version "$(rustc --version --verbose | tr '\n' ';' | sed 's/;$/\n/' )" \
            '{toe_binary: $toe_binary, artifact_sha256: $artifact_sha256, cargo_lock_sha256: $cargo_lock_sha256, rustc_version: $rustc_version}' \
            > certification/evidence/reproducibility/build-b.json
      - name: Upload build B metadata
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-b-${{ github.sha }}
          path: certification/evidence/reproducibility/build-b.json
          retention-days: 7

  verify-reproducibility:
    name: Verify reproducibility
    runs-on: ubuntu-latest
    needs: [build-a, build-b]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download build A metadata
        uses: actions/download-artifact@v4
        with:
          name: reproducibility-a-${{ github.sha }}
          path: certification/evidence/reproducibility
      - name: Download build B metadata
        uses: actions/download-artifact@v4
        with:
          name: reproducibility-b-${{ github.sha }}
          path: certification/evidence/reproducibility
      - name: Verify reproducibility gate
        run: |
          set -euo pipefail
          ./scripts/verify-reproducibility.sh \
            certification/evidence/reproducibility/build-a.json \
            certification/evidence/reproducibility/build-b.json
      - name: Upload reproducibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-${{ github.sha }}
          path: certification/evidence/reproducibility/
          retention-days: 30
