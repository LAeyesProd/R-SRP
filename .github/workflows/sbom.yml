# SBOM workflow for RSRP
# Generates CycloneDX and SPDX SBOMs, signs the bundle with keyless Cosign, and publishes artifacts.

name: SBOM

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

env:
  CARGO_TERM_COLOR: always
  COSIGN_EXPERIMENTAL: "1"

jobs:
  sbom:
    name: Generate and Sign SBOM bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Install jq
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Prefetch dependencies
        run: cargo fetch --locked

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Install Syft
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM bundle
        run: |
          set -euo pipefail
          mkdir -p sbom
          cargo cyclonedx --manifest-path Cargo.toml --all --format json --override-filename rsrp.cdx.json
          mv rsrp.cdx.json sbom/rsrp.cdx.json
          syft dir:. -o spdx-json > sbom/rsrp.spdx.json
          tar -czf sbom/rsrp-sbom-${GITHUB_SHA}.tar.gz -C sbom rsrp.cdx.json rsrp.spdx.json
          sha256sum sbom/rsrp-sbom-${GITHUB_SHA}.tar.gz > sbom/rsrp-sbom-${GITHUB_SHA}.tar.gz.sha256

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.10.1

      - name: Sign SBOM bundle (keyless)
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature sbom/rsrp-sbom-${GITHUB_SHA}.tar.gz.sig \
            --output-certificate sbom/rsrp-sbom-${GITHUB_SHA}.tar.gz.pem \
            sbom/rsrp-sbom-${GITHUB_SHA}.tar.gz

      - name: Verify SBOM signature and digest
        run: |
          set -euo pipefail
          ./scripts/verify-sbom.sh \
            sbom/rsrp.cdx.json \
            sbom/rsrp-sbom-${GITHUB_SHA}.tar.gz \
            sbom/rsrp-sbom-${GITHUB_SHA}.tar.gz.sha256 \
            sbom/rsrp-sbom-${GITHUB_SHA}.tar.gz.sig \
            sbom/rsrp-sbom-${GITHUB_SHA}.tar.gz.pem \
            "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/sbom.yml@.*$"

      - name: Upload signed SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-sbom-${{ github.sha }}
          path: |
            sbom/rsrp.cdx.json
            sbom/rsrp.spdx.json
            sbom/rsrp-sbom-${{ github.sha }}.tar.gz
            sbom/rsrp-sbom-${{ github.sha }}.tar.gz.sha256
            sbom/rsrp-sbom-${{ github.sha }}.tar.gz.sig
            sbom/rsrp-sbom-${{ github.sha }}.tar.gz.pem
          retention-days: 90

      - name: Publish SBOM assets on release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom/rsrp-sbom-${{ github.sha }}.tar.gz
            sbom/rsrp-sbom-${{ github.sha }}.tar.gz.sha256
            sbom/rsrp-sbom-${{ github.sha }}.tar.gz.sig
            sbom/rsrp-sbom-${{ github.sha }}.tar.gz.pem
