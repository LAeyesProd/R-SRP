[graph]
targets = []
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # rustls stack currently pulls rustls-pemfile transitively; temporary accepted risk (DR-001).
    { id = "RUSTSEC-2025-0134", reason = "temporary accepted risk; see docs/DEPENDENCY_RISK_ASSESSMENT.md (DR-001) and docs/CERTIFICATION_BUNDLE.md ; tracked: https://github.com/LAeyesProd/R-SRP/issues/184 ; review-date: 2026-03-31" },
    # No fixed releases are available for these unsoundness advisories; cargo-audit remains
    # configured to ignore them until upstream publishes patched versions (DR-002).
    { id = "RUSTSEC-2026-0190", reason = "no fixed upstream release; temporary accepted risk documented in docs/DEPENDENCY_RISK_ASSESSMENT.md (DR-002)" },
    { id = "RUSTSEC-2026-0097", reason = "no fixed upstream release; temporary accepted risk documented in docs/DEPENDENCY_RISK_ASSESSMENT.md (DR-002)" },
]

[licenses]
allow = [
    "EUPL-1.2",
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
